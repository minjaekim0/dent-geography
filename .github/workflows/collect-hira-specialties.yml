name: Collect HIRA dental specialties

on:
  schedule:
    # 11:17 KST daily. Scheduled jobs can start a few minutes late on GitHub.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hira-specialty-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect 1,000 unprocessed providers at a low request rate
        run: >-
          python scripts/collect_specialties_from_csv.py
          --targets data/specialty_targets_2026-06-30.csv
          --output data/specialties_2026-06-30.csv
          --limit 1000 --delay 2 --timeout 25
      - name: Save newly collected results
        run: |
          if git diff --quiet -- data/specialties_2026-06-30.csv; then
            echo "No new specialty observations"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specialties_2026-06-30.csv
          git commit -m "Collect HIRA dental specialty data"
          git push
